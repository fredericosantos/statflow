[project]
name = "statflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "frederico santos", email = "fredericobsantos@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mlflow>=3.8.1",
    "numpy>=2.4.1",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "scipy>=1.17.0",
    "statsmodels>=0.14.6",
    "streamlit>=1.53.0",
    "streamlit-sortables>=0.3.1",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
# MLflow's public API attributes (MlflowClient, search_runs, get_experiment_by_name)
# are not typed in mlflow's stubs; suppress the false-positive warnings.
possibly-missing-attribute = "ignore"
